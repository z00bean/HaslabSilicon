name: Repository foundation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select pinned Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.10'
      - name: Check repository foundation
        run: make check
      - name: Install reference-model dependencies
        run: python -m pip install 'numpy==1.26.4'
      - name: Test reference model, compiler/runtime slice, simulator, and conformance corpus
        run: make test
