[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "haslab"
version = "0.0.0"
description = "HASLAB golden numerical reference model and project foundation."
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Zubin Bhuyan" }]
dependencies = ["numpy>=1.26"]

[tool.setuptools.packages.find]
where = ["reference"]
include = ["haslab_ref*"]

[tool.pytest.ini_options]
testpaths = ["reference/tests", "compiler/tests", "runtime/tests"]
addopts = "-ra"
