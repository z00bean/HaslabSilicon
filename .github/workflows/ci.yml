name: Repository foundation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check repository foundation
        run: make check
      - name: Install reference-model dependencies
        run: python -m pip install 'numpy>=1.26'
      - name: Test Python reference model
        run: make test
